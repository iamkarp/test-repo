<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handwriting OCR Overlay</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Handwriting OCR Overlay</h1>
            <p class="subtitle">Upload a document with handwriting to see text recognition overlay</p>
        </header>

        <main>
            <div class="upload-section">
                <label for="file-input" class="upload-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    Choose Image
                </label>
                <input type="file" id="file-input" accept="image/*" style="display: none;">
                <p class="file-name" id="file-name">No file selected</p>
            </div>

            <div class="controls" id="controls" style="display: none;">
                <button id="process-btn" class="btn btn-primary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    Process Handwriting
                </button>

                <div class="overlay-controls" id="overlay-controls" style="display: none;">
                    <label class="toggle-switch">
                        <input type="checkbox" id="toggle-overlay" checked>
                        <span class="slider"></span>
                        <span class="label">Show Overlay</span>
                    </label>

                    <div class="opacity-control">
                        <label for="opacity-slider">Overlay Opacity:</label>
                        <input type="range" id="opacity-slider" min="0" max="100" value="80" step="5">
                        <span id="opacity-value">80%</span>
                    </div>
                </div>
            </div>

            <div class="progress-section" id="progress-section" style="display: none;">
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <p class="progress-text" id="progress-text">Initializing OCR...</p>
            </div>

            <div class="viewer-section" id="viewer-section" style="display: none;">
                <div class="image-container" id="image-container">
                    <img id="preview-image" src="" alt="Document preview">
                    <canvas id="overlay-canvas"></canvas>
                </div>
            </div>

            <div class="info-section" id="info-section" style="display: none;">
                <h3>Recognized Text:</h3>
                <div class="recognized-text" id="recognized-text"></div>
            </div>
        </main>

        <footer>
            <p>Powered by Tesseract.js OCR Engine</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
